name: Bug report
description: Report a reproducible problem in Gugo
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Gugo. Do not include secrets or private data.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Start with...\n2. Open...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.10.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux, Docker, Other]
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant logs or diagnostics
      description: Redact tokens, API keys, email addresses, paths, prompts, and user content.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed all credentials, personal data, and private conversation content.
          required: true
