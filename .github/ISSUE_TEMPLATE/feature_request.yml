name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful solution and any alternatives.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and security impact
      description: Note changes to storage, APIs, authentication, permissions, or tool execution.
