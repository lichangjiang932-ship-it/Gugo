name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to release (for example v0.10.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    name: Required CI gates
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
    permissions:
      contents: read
      pull-requests: read

  release:
    needs: ci
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm

      - name: Require Windows code-signing credentials
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            throw 'WINDOWS_CSC_LINK is required for a production release'
          }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw 'WINDOWS_CSC_KEY_PASSWORD is required for a production release'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PUBLISHER_NAME)) {
            throw 'WINDOWS_PUBLISHER_NAME must match the signing certificate publisher exactly'
          }

      - run: npm ci
      - run: npm run build
      - run: npm run desktop:check

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $lockVersion = node -p "require('./package-lock.json').version"
          $lockRootVersion = node -p "require('./package-lock.json').packages[''].version"
          if ($lockVersion -ne $version -or $lockRootVersion -ne $version) {
            throw "package-lock.json versions ($lockVersion, $lockRootVersion) do not match package.json $version"
          }
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package version v$version"
          }
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if (-not $tagCommit -or $tagCommit -ne $headCommit) {
            throw "Tag $env:RELEASE_TAG does not resolve to checked-out commit $headCommit"
          }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not resolve the protected release lineage from origin/main'
          }
          git merge-base --is-ancestor $headCommit refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release commit $headCommit is not reachable from origin/main"
          }

      - name: Package browser distribution
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          node scripts/release/package-web.mjs --output-dir .artifacts/web
          tar -C .artifacts/web -czf "gugo-$version-web.tar.gz" "gugo-$version-web"

      - name: Verify browser distribution in an isolated directory
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          scripts/release/verify-web-release.ps1 -ArchivePath "gugo-$version-web.tar.gz"

      - name: Package Windows desktop installer
        run: npm run desktop:package:signed

      - name: Verify Windows installer signature
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expectedInstallerName = "Gugo-Setup-$version-x64.exe"
          $installers = @(Get-ChildItem -LiteralPath release -Filter 'Gugo-Setup-*.exe' -File)
          if ($installers.Count -ne 1 -or $installers[0].Name -cne $expectedInstallerName) {
            throw "Expected exactly one Windows installer named $expectedInstallerName"
          }
          $packagedExecutable = (Resolve-Path 'release/win-unpacked/Gugo.exe').Path
          $signedExecutables = @($installers[0].FullName, $packagedExecutable)
          $signerThumbprint = $null
          $signerName = $null
          foreach ($executable in $signedExecutables) {
            $signature = Get-AuthenticodeSignature -LiteralPath $executable
            if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
              throw "Executable signature is not valid: $executable ($($signature.Status))"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Executable signature is missing a trusted timestamp: $executable"
            }
            if ($null -eq $signerThumbprint) {
              $signerThumbprint = $signature.SignerCertificate.Thumbprint
              $signerName = $signature.SignerCertificate.GetNameInfo(
                [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
                $false
              )
            } elseif ($signature.SignerCertificate.Thumbprint -ne $signerThumbprint) {
              throw "Packaged executables were signed by different certificates: $executable"
            }
          }
          if ([string]::IsNullOrWhiteSpace($signerName)) {
            throw 'The signing certificate has no publisher name'
          }
          if ($signerName -cne $env:WINDOWS_PUBLISHER_NAME) {
            throw "Signer $signerName does not match configured WINDOWS_PUBLISHER_NAME"
          }
          $updateConfigPath = 'release/win-unpacked/resources/app-update.yml'
          if (-not (Test-Path -LiteralPath $updateConfigPath -PathType Leaf)) {
            throw 'Packaged app-update.yml is missing'
          }
          $updateConfig = Get-Content -LiteralPath $updateConfigPath -Raw
          if ($updateConfig -notmatch '(?m)^publisherName:[ \t]*(?:\S.*|\r?\n[ \t]+-[ \t]+\S.*)$') {
            throw 'Packaged app-update.yml has no publisherName for update signature verification'
          }
          if (-not $updateConfig.Contains($signerName)) {
            throw "Packaged updater publisherName does not match signer $signerName"
          }

      - name: Create release checksum manifest
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $webAsset = (Resolve-Path "gugo-$version-web.tar.gz").Path
          $installerName = "Gugo-Setup-$version-x64.exe"
          $installerPath = "release/$installerName"
          $blockmapPath = "$installerPath.blockmap"
          $updateMetadataPath = 'release/latest.yml'
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw 'Windows installer was not generated'
          }
          if (-not (Test-Path -LiteralPath $blockmapPath -PathType Leaf)) {
            throw 'Windows differential update blockmap was not generated'
          }
          if (-not (Test-Path -LiteralPath $updateMetadataPath -PathType Leaf)) {
            throw 'Auto-update metadata latest.yml was not generated'
          }
          $expectedDesktopNames = @($installerName, "$installerName.blockmap", 'latest.yml')
          $unexpectedDesktopAssets = @(Get-ChildItem -LiteralPath release -File | Where-Object {
            $_.Extension -eq '.exe' -or
            $_.Extension -eq '.blockmap' -or
            $_.Name -eq 'latest.yml'
          } | Where-Object { $expectedDesktopNames -cnotcontains $_.Name })
          if ($unexpectedDesktopAssets.Count -ne 0) {
            throw "Unexpected Windows release assets: $($unexpectedDesktopAssets.Name -join ', ')"
          }
          $desktopAssets = @(
            (Resolve-Path -LiteralPath $installerPath).Path
            (Resolve-Path -LiteralPath $blockmapPath).Path
            (Resolve-Path -LiteralPath $updateMetadataPath).Path
          )
          if ($desktopAssets.Count -ne 3) { throw 'Expected exactly three Windows release assets' }
          $checksumInputs = @($webAsset) + @($desktopAssets)
          node scripts/release/create-checksums.mjs --output SHA256SUMS.txt @checksumInputs
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create SHA256SUMS.txt' }

      - name: Attest release build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            gugo-*-web.tar.gz
            release/*.exe
            release/*.blockmap
            release/latest.yml
            SHA256SUMS.txt

      - name: Create or update GitHub Release through REST API
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $webAsset = (Resolve-Path "gugo-$version-web.tar.gz").Path
          $installerName = "Gugo-Setup-$version-x64.exe"
          $installerPath = "release/$installerName"
          $blockmapPath = "$installerPath.blockmap"
          $updateMetadataPath = 'release/latest.yml'
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw 'Windows installer was not generated'
          }
          if (-not (Test-Path -LiteralPath $blockmapPath -PathType Leaf)) {
            throw 'Windows differential update blockmap was not generated'
          }
          if (-not (Test-Path -LiteralPath $updateMetadataPath -PathType Leaf)) {
            throw 'Auto-update metadata latest.yml was not generated'
          }
          $expectedDesktopNames = @($installerName, "$installerName.blockmap", 'latest.yml')
          $unexpectedDesktopAssets = @(Get-ChildItem -LiteralPath release -File | Where-Object {
            $_.Extension -eq '.exe' -or
            $_.Extension -eq '.blockmap' -or
            $_.Name -eq 'latest.yml'
          } | Where-Object { $expectedDesktopNames -cnotcontains $_.Name })
          if ($unexpectedDesktopAssets.Count -ne 0) {
            throw "Unexpected Windows release assets: $($unexpectedDesktopAssets.Name -join ', ')"
          }
          $desktopAssets = @(
            (Resolve-Path -LiteralPath $installerPath).Path
            (Resolve-Path -LiteralPath $blockmapPath).Path
            (Resolve-Path -LiteralPath $updateMetadataPath).Path
          )
          if ($desktopAssets.Count -ne 3) { throw 'Expected exactly three Windows release assets' }
          $checksumAsset = (Resolve-Path 'SHA256SUMS.txt').Path
          $assets = @($webAsset) + @($desktopAssets) + @($checksumAsset)
          if ($assets.Count -ne 5) { throw 'Expected exactly five GitHub Release assets' }
          $releaseCommit = (git rev-parse HEAD).Trim()
          node scripts/release/publish-github-release.mjs `
            --repo $env:GITHUB_REPOSITORY `
            --tag $env:RELEASE_TAG `
            --commit $releaseCommit `
            -- @assets
          if ($LASTEXITCODE -ne 0) { throw 'GitHub REST API release publication failed' }
