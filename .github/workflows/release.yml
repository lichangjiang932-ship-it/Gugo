name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to release (for example v0.10.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run licenses
      - run: npm run build

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package version v$version"
          }

      - name: Package browser distribution
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          tar -czf "gugo-$version-web.tar.gz" dist

      - name: Package Windows desktop installer
        run: npm run desktop:package

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $webAsset = (Resolve-Path "gugo-$version-web.tar.gz").Path
          $desktopAssets = Get-ChildItem release -File | Where-Object {
            $_.Extension -eq '.exe' -or
            $_.Extension -eq '.blockmap' -or
            $_.Name -eq 'latest.yml'
          } | ForEach-Object { $_.FullName }
          if (-not ($desktopAssets | Where-Object { $_ -like '*.exe' })) {
            throw 'Windows installer was not generated'
          }
          if (-not ($desktopAssets | Where-Object { $_ -like '*latest.yml' })) {
            throw 'Auto-update metadata latest.yml was not generated'
          }
          $assets = @($webAsset) + @($desktopAssets)
          gh release create $env:RELEASE_TAG @assets --verify-tag --generate-notes
