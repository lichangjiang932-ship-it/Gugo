name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref that every CI job must validate
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify bundled ripgrep
        run: node -e "const { execFileSync } = require('node:child_process'); const { rgPath } = require('@vscode/ripgrep'); process.stdout.write(execFileSync(rgPath, ['--version']))"

      - name: Lint
        run: npm run lint

      - name: Offline agent capability gate
        env:
          TEST_CONCURRENCY: 1
        run: npm run eval:offline

      - name: Test
        timeout-minutes: 30
        env:
          TEST_CONCURRENCY: ${{ runner.os == 'Windows' && '1' || '4' }}
        run: npm test

      - name: Checkpoint performance guard
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: npm run benchmark:checkpoint

      - name: Build
        run: npm run build

  node-runtime-compatibility:
    name: Node ${{ matrix.node-version }} runtime compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.19.x, 24.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Native SQLite and server runtime gate
        run: node --test --test-concurrency=1 tests/dbMigrationRegistry.test.js tests/runtimeReadiness.test.js

      - name: Lint
        if: matrix.node-version == '24.x'
        run: npm run lint

      - name: Build
        if: matrix.node-version == '24.x'
        run: npm run build

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Enforce coverage thresholds
        env:
          TEST_CONCURRENCY: 1
        run: npm run test:coverage

  dependency-audit:
    name: production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Fail on high or critical production vulnerabilities
        run: npm run audit:prod

      - name: Verify production dependency licenses
        run: npm run licenses

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Scan repository history with Gitleaks
        if: ${{ inputs.checkout_ref == '' }}
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.24.3'

      # gitleaks-action treats every tag creation as a push, then exits successfully
      # when the tag payload contains no commits. Release calls always provide an
      # explicit checkout_ref, so scan the checked-out ref instead of the event payload.
      - name: Install pinned Gitleaks for explicit ref scan
        if: ${{ inputs.checkout_ref != '' }}
        shell: bash
        env:
          GITLEAKS_VERSION: '8.24.3'
          GITLEAKS_ARCHIVE_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          install_dir="$RUNNER_TEMP/gitleaks-$GITLEAKS_VERSION"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$archive_path"
          printf '%s  %s\n' "$GITLEAKS_ARCHIVE_SHA256" "$archive_path" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive_path" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan explicit release ref history with Gitleaks
        if: ${{ inputs.checkout_ref != '' }}
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --exit-code 2 \
            --report-format sarif \
            --report-path results.sarif \
            --log-opts="$target_sha"

  docker:
    name: Docker configuration and image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Prepare Compose environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build image
        run: docker build --tag gugo:ci .
