services:
  app:
    build: .
    ports:
      - "${SERVER_PORT:-5173}:${SERVER_PORT:-5173}"
    env_file:
      - .env
    volumes:
      - app-data:/app/server-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  app-data:
