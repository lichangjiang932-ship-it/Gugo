services:
  app:
    build: .
    ports:
      - "${SERVER_PORT:-5173}:${SERVER_PORT:-5173}"
    env_file:
      - .env
    volumes:
      - app-data:/app/server-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  app-data:
