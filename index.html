<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>Your Model Atelier</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-log" style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#ef4444;color:white;padding:10px;font-size:12px;display:none;white-space:pre-wrap;max-height:200px;overflow:auto;"></div>
    <script>
      window.__errors = [];
      window.addEventListener('error', function(e) {
        window.__errors.push(e.error?.stack || e.message);
        var el = document.getElementById('error-log');
        if (el) { el.style.display = 'block'; el.textContent = window.__errors.join('\n---\n'); }
        console.error('Captured:', e.error);
      });
      window.addEventListener('unhandledrejection', function(e) {
        window.__errors.push('Promise rejection: ' + (e.reason?.stack || e.reason));
        var el = document.getElementById('error-log');
        if (el) { el.style.display = 'block'; el.textContent = window.__errors.join('\n---\n'); }
        console.error('Captured promise:', e.reason);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
