appId: com.gugo.atelier
productName: Gugo
artifactName: Gugo-Setup-${version}-${arch}.${ext}
asar: true
asarUnpack:
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - ffmpeg.exe
      - ffprobe.exe
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: resources/licenses
    to: licenses
    filter:
      - "**/*"
npmRebuild: false
compression: normal
directories:
  output: release
files:
  - dist/**/*
  - server/**/*
  - shared/**/*
  - seed/**/*
  - plugins/**/*
  - skill-packs/**/*
  - src/data.js
  - src/data/**/*
  - src/lib/pptCore.js
  - src/lib/presentationPlanner.js
  - desktop/main.js
  - desktop/petDrag.js
  - desktop/preload.cjs
  - desktop/runtime.js
  - desktop/security.js
  - build/icon.ico
  - package.json
win:
  executableName: Gugo
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Gugo
  uninstallDisplayName: Gugo
  deleteAppDataOnUninstall: false
  runAfterFinish: true
publish:
  provider: github
  owner: lichangjiang932-ship-it
  repo: Gugo
  releaseType: release
  channel: latest
